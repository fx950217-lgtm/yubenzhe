services:
  frontend:
    image: yubenzhe-public:${RELEASE_TAG:?Set RELEASE_TAG}
    environment:
      PUBLIC_FRONTEND: "true"
      PUBLIC_ORIGIN: ${YBZ_PREVIEW_ORIGIN:?Set YBZ_PREVIEW_ORIGIN}
      PUSH_CONFIG_FILE: /run/ybz-secrets/push.json
    volumes:
      - ./secrets/push.json:/run/ybz-secrets/push.json:ro
  admin:
    image: yubenzhe-public:${RELEASE_TAG:?Set RELEASE_TAG}
  public-proxy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    network_mode: host
    environment:
      YBZ_PREVIEW_ORIGIN: ${YBZ_PREVIEW_ORIGIN:?Set YBZ_PREVIEW_ORIGIN}
      ACME_DIRECTORY: ${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
      FRONT_PORT: ${FRONT_PORT:-18808}
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
