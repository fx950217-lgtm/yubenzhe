services:
  frontend:
    image: yubenzhe-public:0.11.1
    environment:
      PUBLIC_FRONTEND: "true"
      PUBLIC_ORIGIN: https://66.42.56.29
  public-proxy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
