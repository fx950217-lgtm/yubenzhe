name: iOS preview package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current consumer web assets
        working-directory: tongban
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm build
      - name: Generate iOS web snapshot from current source
        working-directory: yubenzhe-ios
        run: python3 scripts/sync-web.py
      - name: Verify packaging and bridge
        working-directory: yubenzhe-ios
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/bridge.test.mjs
      - name: Build iOS device application
        working-directory: yubenzhe-ios
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/build-ios.sh 2>&1 | tee build/ios-build.log
      - name: Sign and package for rootless jailbreak
        working-directory: yubenzhe-ios
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/Yubenzhe.app
          codesign --force --sign - --timestamp=none --entitlements App/Preview.entitlements "$APP"
          python3 scripts/package-deb.py --app "$APP" --scheme rootless
          shasum -a 256 packages/*.deb > packages/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: yubenzhe-ios-preview
          path: |
            yubenzhe-ios/packages/*.deb
            yubenzhe-ios/packages/SHA256SUMS.txt
            yubenzhe-ios/build/ios-build.log
          retention-days: 7
          if-no-files-found: error
